name: Upload docs to R2 for AutoRAG

on:
  push:
    branches: [master]
    paths:
      - 'src/content/docs/**'
  workflow_dispatch:

jobs:
  upload-to-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload MD files to R2 (for AutoRAG indexing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          for file in $(find ./src/content/docs -name "*.md" -o -name "*.mdx"); do
            key="docs/${file#./src/content/docs/}"
            echo "Uploading $file to $key"
            wrangler r2 object put "manual-book-content/$key" --file "$file"
          done
