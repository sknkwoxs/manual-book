<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dcamp 개발명세서</title>
  <style>
    /* 기본 스타일 */
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11pt;
      line-height: 1.7;
      color: #333;
      max-width: 210mm;
      margin: 0 auto;
      padding: 20mm;
      background: #fff;
    }
    
    /* 제목 스타일 */
    h1 {
      font-size: 24pt;
      font-weight: 700;
      color: #1a1a1a;
      border-bottom: 3px solid #333;
      padding-bottom: 10px;
      margin-top: 40px;
      margin-bottom: 20px;
      page-break-before: always;
    }
    
    h1:first-of-type {
      page-break-before: avoid;
    }
    
    h2 {
      font-size: 16pt;
      font-weight: 600;
      color: #2a2a2a;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    
    h3 {
      font-size: 13pt;
      font-weight: 600;
      color: #3a3a3a;
      margin-top: 25px;
      margin-bottom: 12px;
    }
    
    h4 {
      font-size: 11pt;
      font-weight: 600;
      color: #4a4a4a;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    
    /* 단락 */
    p {
      margin: 10px 0;
      text-align: justify;
    }
    
    /* 표 스타일 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 10pt;
    }
    
    th, td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    
    th {
      background-color: #f5f5f5;
      font-weight: 600;
      white-space: nowrap;
    }
    
    tr:nth-child(even) {
      background-color: #fafafa;
    }
    
    /* 코드/다이어그램 스타일 */
    pre {
      background-color: #f8f8f8;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 15px;
      overflow-x: auto;
      font-family: 'D2Coding', 'Consolas', 'Monaco', monospace;
      font-size: 9pt;
      line-height: 1.5;
      white-space: pre;
      margin: 15px 0;
    }
    
    code {
      font-family: 'D2Coding', 'Consolas', 'Monaco', monospace;
      font-size: 9pt;
      background-color: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
    }
    
    pre code {
      background: none;
      padding: 0;
    }
    
    /* 리스트 스타일 */
    ul, ol {
      margin: 10px 0;
      padding-left: 25px;
    }
    
    li {
      margin: 5px 0;
    }
    
    /* 구분선 */
    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 30px 0;
    }
    
    /* 링크 */
    a {
      color: #0066cc;
      text-decoration: none;
    }
    
    /* 인쇄 설정 */
    @media print {
      body {
        padding: 0;
        font-size: 10pt;
      }
      
      h1 {
        page-break-before: always;
        font-size: 20pt;
      }
      
      h1:first-of-type {
        page-break-before: avoid;
      }
      
      pre {
        page-break-inside: avoid;
        font-size: 8pt;
      }
      
      table {
        page-break-inside: avoid;
        font-size: 9pt;
      }
      
      h2, h3 {
        page-break-after: avoid;
      }
    }
    
    /* 표지 스타일 */
    .cover {
      text-align: center;
      padding: 100px 0;
    }
    
    .cover h1 {
      font-size: 32pt;
      border: none;
      margin-bottom: 20px;
      page-break-before: avoid;
    }
    
    .cover .subtitle {
      font-size: 14pt;
      color: #666;
      margin-bottom: 60px;
    }
    
    .cover .info {
      font-size: 11pt;
      color: #555;
      line-height: 2;
    }
    
    /* 목차 스타일 */
    .toc {
      page-break-after: always;
    }
    
    .toc h2 {
      text-align: center;
      border: none;
    }
    
    .toc ul {
      list-style: none;
      padding: 0;
    }
    
    .toc li {
      padding: 8px 0;
      border-bottom: 1px dotted #ccc;
    }
    
    /* 섹션 구분 */
    .section {
      page-break-before: always;
    }
    
    .section:first-of-type {
      page-break-before: avoid;
    }
  </style>
</head>
<body>

<!-- 여기에 각 섹션 HTML을 붙여넣으세요 -->

</body>
</html>
