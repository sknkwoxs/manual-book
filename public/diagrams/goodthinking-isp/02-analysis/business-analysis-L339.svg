t></g></g><g class="edgeLabel"><g class="label" data-id="L_root_team5_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="flowchart-root-0" transform="translate(758, 149)"><rect class="basic label-container" style="" x="-130" y="-141" width="260" height="282"/><g class="label" style="" transform="translate(-100, -126)"><rect/><foreignObject width="200" height="252"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[데이터]<br />일일 수작업 시간 추정<br />(전 직원 합산)<br /><br />CS/판매/정산 3개 팀: 7~10시간/일<br />편집팀: 월 30~50시간 (월별 변동)<br />콜센터: 이중 기록 + CTI 미연동 추가 소요<br />영업추진팀: 이중·삼중 입력 + 엑셀 의존<br />월간 합산: 170~250시간/월 + α</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-team1-1" transform="translate(138, 544)"><rect class="basic label-container" style="" x="-130" y="-172.5" width="260" height="345"/><g class="label" style="" transform="translate(-100, -157.5)"><rect/><foreignObject width="200" height="315"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[정기구독팀]<br />인터뷰 확인<br />정황규, 어은진<br />약 4~5시간/일<br />────<br />외부몰 주문 수집+Excel 표준화<br />+CS 등록+검수: 3~4시간 (일괄 배치)<br />취소/환불(나이스페이 다중 계정): 수시<br />선발송 처리: 수시<br />문화누리카드 수기 결제: 수시<br />재고 보정: 월 1회<br />개인정보 수동 파기: 월 1회<br />일반계좌 입금 매칭: 수시</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-team2-2" transform="translate(448, 544)"><rect class="basic label-container" style="" x="-130" y="-204" width="260" height="408"/><g class="label" style="" transform="translate(-100, -189)"><rect/><foreignObject width="200" height="378"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[영업추진팀]<br />인터뷰 확인<br />이성수, 권지은<br />이중·삼중 입력 + 엑셀 전적 의존<br />────<br />고려출판물류→위하고 이중 입력: 매일<br />입금 내역→관리 엑셀→위하고 삼중 입력: 수시<br />통장 거래 내역 수작업 대조: 수시<br />다량 특판 개인 엑셀 관리: 매일<br />총판 출고 부수 협의(전화)→엑셀: 매월<br />반품 순매출→위하고 등록: 매월<br />편집팀 인쇄 완료 시점 수동 확인: 수시<br />카드 매출전표 팩스/메일 발송: 수시</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-team3-3" transform="translate(758, 544)"><rect class="basic label-container" style="" x="-130" y="-141" width="260" height="282"/><g class="label" style="" transform="translate(-100, -126)"><rect/><foreignObject width="200" height="252"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[경영지원팀]<br />인터뷰 확인<br />송윤경, 김나현<br />약 1.5~2시간/일<br />────<br />입금 내역 조회→배분: 매일 아침<br />CS→위하고 양식 엑셀 재가공: 수시<br />선수수익 현황표→세무법인: 월 1회<br />인세 계산 수기 작성: 수시<br />투트랙(CS↔위하고) 이중 관리</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-team4-4" transform="translate(1068, 544)"><rect class="basic label-container" style="" x="-130" y="-183" width="260" height="366"/><g class="label" style="" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[편집팀]<br />인터뷰 확인<br />이민애 외 8명<br />월 30~50시간 (비정기)<br />────<br />디지털 업로드+리사이즈: 60~120분/월<br />원고료 정산(엑셀→WEHAGO): 30~60분/월<br />순환 교정(종이 기반): 연인원 20~30시간/월<br />공모전 원고 배분·검토: 연 3회 집중<br />어드민→CMS 복사·붙여넣기: 수시<br />오프라인 원고 스캔: 수시</p></span></div></foreignObject></g></g><g class="node default" id="flowchart-team5-5" transform="translate(1378, 544)"><rect class="basic label-container" style="" x="-130" y="-204" width="260" height="408"/><g class="label" style="" transform="translate(-100, -189)"><rect/><foreignObject width="200" height="378"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>[외주콜센터]<br />인터뷰 확인<br />더아이앤오 4명 (OB2+IB1+관리1)<br />이중 기록 + CTI 미연동 추가 소요<br />근무 10시~17시<br />IB 일평균 75~80건 (월 1,500건)<br />OB 성공 일 150~200건 (트라이 300~500건)<br />상담 1건 30초~2분30초<br />────<br />CTI 미연동 전화번호 수동 조회: 건당<br />CS 시스템+엑셀 이중 기록: 상담 건마다<br />오토콜 양식 정제: 데이터 수령 시<br />메모 개별 업로드: 건당 반복<br />데일리 마감 리포트: 매일<br />마케팅 동의 수기 기재: 건마다</p></span></div></foreignObject></g></g></g></g></g></svg>